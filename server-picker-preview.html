<!DOCTYPE html><html><head><style>
  body{background:#0a0a0a;color:#fff;padding:32px;font-family:system-ui;margin:0}
  .glass-card{background:rgba(255,255,255,0.025);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.06);border-radius:12px}
  .container{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  h3{font-size:13px;color:#666;font-weight:600;margin:0 0 8px;text-transform:uppercase;letter-spacing:0.1em}
</style></head>
<body>
<div class="container">
  <div>
    <h3>NEW (refined)</h3>
    <div class="glass-card" style="padding:12px;display:flex;flex-direction:column;gap:12px">
      <!-- tabs -->
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <button style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;background:hsl(354,78%,52%);color:white;box-shadow:0 4px 16px -4px rgba(228,72,89,0.6);border:none">
          <span>📝</span>Sub<span style="background:rgba(255,255,255,0.2);padding:0 6px;border-radius:4px;font-size:9px;font-family:monospace">6</span>
        </button>
        <button style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.05)">
          <span>🎤</span>Dub<span style="background:rgba(255,255,255,0.05);padding:0 6px;border-radius:4px;font-size:9px;font-family:monospace;color:rgba(255,255,255,0.4)">5</span>
        </button>
        <span style="margin-left:auto;font-size:10px;color:rgba(255,255,255,0.45)">Tip: try another server if playback stalls</span>
      </div>
      <!-- cards -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
        <!-- active card -->
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(228,72,89,0.1);border:1px solid rgba(228,72,89,0.6);color:white;box-shadow:0 0 0 1px rgba(228,72,89,0.25)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="height:6px;width:6px;border-radius:50%;background:hsl(354,78%,55%);box-shadow:0 0 8px hsl(354,78%,55%)"></span>
              <span style="font-size:13px;font-weight:600;color:hsl(354,78%,55%)">Yuki</span>
            </div>
            <span style="color:hsl(354,78%,55%)">✓</span>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(228,72,89,0.7)">Good · Multi-Q</div>
        </button>
        <!-- default card -->
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(252,191,73,0.25);color:rgba(255,255,255,0.85)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="height:6px;width:6px;border-radius:50%;background:rgba(252,191,73,0.8)"></span>
              <span style="font-size:13px;font-weight:600">Kiwi</span>
            </div>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(255,255,255,0.4)">Fast · HQ</div>
        </button>
        <!-- normal card -->
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="height:6px;width:6px;border-radius:50%;background:rgba(255,255,255,0.25)"></span>
              <span style="font-size:13px;font-weight:600">Mochi</span>
            </div>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(255,255,255,0.4)">Fastest · HQ</div>
        </button>
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="height:6px;width:6px;border-radius:50%;background:rgba(255,255,255,0.25)"></span>
            <span style="font-size:13px;font-weight:600">Mimi</span>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(255,255,255,0.4)">Fastest · HQ</div>
        </button>
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="height:6px;width:6px;border-radius:50%;background:rgba(255,255,255,0.25)"></span>
            <span style="font-size:13px;font-weight:600">Beep</span>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(255,255,255,0.4)">Fast</div>
        </button>
        <button style="text-align:left;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.85)">
          <div style="display:flex;align-items:center;gap:6px">
            <span style="height:6px;width:6px;border-radius:50%;background:rgba(255,255,255,0.25)"></span>
            <span style="font-size:13px;font-weight:600">Uwu</span>
          </div>
          <div style="margin-top:2px;font-size:10px;color:rgba(255,255,255,0.4)">Fast</div>
        </button>
      </div>
    </div>
  </div>
</div>
</body></html>
