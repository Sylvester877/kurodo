<!doctype html>
<html lang="en" class="theme-anidap">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <!-- Content-Security-Policy — silences Electron's "Insecure CSP" warning
         and is defense-in-depth against XSS (scraped titles/descriptions are
         rendered into the DOM). Needs to stay permissive in specific places:
         • script/style 'unsafe-inline' — the async font-load onload trick and
           React's inline style attributes (style="…" is how every component
           is laid out; blocking it blanks the whole UI)
         • media/connect http(s): — HLS feeds the player via blob: and direct
           CDN .m3u8/.mp4 URLs are passed straight to <video>
         • http://127.0.0.1 — the in-app WebTorrent stream + subtitle server
         • frame-src YouTube — trailer embeds
         All API/data traffic goes through our own localhost origin, so
         default-src 'self' still covers the app itself. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https: http: http://127.0.0.1:*; connect-src 'self' blob: https: http: ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; worker-src 'self' blob:"
    />

    <title>Kurōdo · Discover & Stream Anime</title>
    <meta name="description" content="Kurōdo (黒道) — a sleek anime discovery & streaming companion. Browse, search, and track anime with metadata from Jikan, AniList, and AniZip." />

    <!-- Open Graph -->
    <meta property="og:title" content="Kurōdo · Discover & Stream Anime" />
    <meta property="og:description" content="A sleek anime discovery & streaming companion." />
    <meta property="og:type" content="website" />

    <!-- GPU compositor hint: promote the root element to its own layer for
         smoother scroll + animation performance on integrated GPUs -->
    <style>#root { will-change: transform; contain: layout style; }</style>
    <!-- Preconnect to the APIs we hit on first paint -->
    <link rel="preconnect" href="https://api.jikan.moe" />
    <link rel="preconnect" href="https://cdn.myanimelist.net" crossorigin />
    <link rel="preconnect" href="https://graphql.anilist.co" />
    <!-- AniList image CDN — every hero backdrop + card cover loads from here,
         so connecting early is a meaningful LCP win. -->
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="preconnect" href="https://api.ani.zip" />
    <!-- TMDB — transparent title logos for the hero + details page. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <!-- TVDB — REAL per-episode screenshots (anikage.cc source), CORS * -->
    <link rel="preconnect" href="https://artworks.thetvdb.com" crossorigin />
    <!-- Streaming CDN hosts — warm the TLS handshake before the user clicks Watch -->
    <link rel="dns-prefetch" href="https://anidap.se" />
    <link rel="dns-prefetch" href="https://gogohd.net" />
    <link rel="dns-prefetch" href="https://hianime.to" />
    <link rel="dns-prefetch" href="https://anicrush.to" />
    <!-- Manga image hosts — dns-prefetch so first chapter page loads faster -->
    <link rel="dns-prefetch" href="https://uploads.mangadex.org" />
    <link rel="dns-prefetch" href="https://atsu.moe" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font stylesheet is loaded asynchronously (preload → swap to stylesheet)
         so it never blocks first paint. display=swap in the URL means text
         renders in the fallback font immediately and swaps in — no invisible
         text. Families map 1:1 to the CSS stacks:
         Poppins (--font-sans body) · Bricolage Grotesque (--font-display
         hero wordmark + section headers) · Noto Serif JP (rare .font-jp). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Serif+JP:wght@500;700;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Serif+JP:wght@500;700;900&display=swap" />
    </noscript>

    <!-- Inline SVG favicon (KURODO K mark) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='hsl(0,0%25,4%25)' rx='14'/><path d='M 18 6 L 38 6 L 38 44 L 60 6 L 80 6 L 50 50 L 38 50 L 38 94 L 18 94 Z' fill='white'/><path d='M 38 50 L 60 50 L 84 94 L 60 94 L 38 56 Z' fill='hsl(354,78%25,52%25)'/><path d='M 60 6 L 80 6 L 72 18 Z' fill='hsl(354,78%25,52%25)' fill-opacity='0.85'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
